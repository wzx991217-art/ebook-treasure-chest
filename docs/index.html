<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="私人书库 - 电子书检索与个性化推荐" />
  <meta name="theme-color" content="#5f7f6e" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
  <title>私人书库</title>
  <style>
    :root { --bg:#f2f6f3; --card:#ffffff; --text:#24342b; --muted:#5f6f66; --line:#d7e3db; --accent:#5f7f6e; --accent2:#7a9b8a; }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    .container{max-width:920px;margin:0 auto;padding:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
    h1{font-size:24px;margin:8px 0 4px;color:var(--accent)}
    h2{font-size:18px;margin:0 0 10px}
    .sub{color:var(--muted);font-size:14px}
    input,select,button{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
    .grid{display:grid;grid-template-columns:1fr;gap:10px}
    .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .secondary{background:#799584}
    .book-ops{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .action-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
    .tag-btn{padding:10px 8px;font-size:13px;border-radius:8px;background:#e7efe9;color:#2e4a3b;border:1px solid #cfe0d6;font-weight:600}
    .tag-btn.danger{background:#f3e7e7;color:#7a3434;border-color:#e6c7c7}
    .record-item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fbfdfb;display:grid;gap:6px}
    button{background:var(--accent);color:#fff;border:none;font-weight:600}
    button:hover{background:var(--accent2)}
    .result-count{margin-bottom:10px;color:var(--accent);font-size:14px}
    .book-card{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fff}
    .title-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .meta{font-size:13px;color:var(--muted);margin:6px 0}
    .reason{font-size:13px;color:#30453a;background:#edf3ef;border-left:3px solid var(--accent);padding:6px 8px;border-radius:6px;margin:6px 0}
    .book-link{display:inline-block;text-decoration:none;color:#fff;background:var(--accent);padding:6px 10px;border-radius:8px;font-size:13px}
    .badge{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
    .badge.serious{background:#e6f0eb;color:#315845}
    .badge.fun{background:#f0e8ef;color:#6a3b63}
    .empty{color:var(--muted);font-size:14px;padding:8px 0}
    .reco-columns{display:grid;grid-template-columns:1fr;gap:12px}
    @media (max-width: 520px){.action-buttons{grid-template-columns:repeat(2,minmax(0,1fr))}.btn-row{grid-template-columns:1fr}}
    @media (min-width: 860px){.reco-columns{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>📚 私人书库</h1>
      <p class="sub">保留原书库资源与链接，新增偏好推荐与手机端体验。</p>
    </section>

    <section class="card">
      <h2>🔍 搜索书籍</h2>
      <div class="grid">
        <input id="search-input" type="text" placeholder="搜索 书名 / 作者 / 分类（支持多关键词）" oninput="onSearch(event)" />
        <div id="search-results"></div>
      </div>
    </section>

    <section class="card">
      <h2>🗂️ 分类筛选</h2>
      <select id="category-filter">
        <option value="all">全部分类</option>
      </select>
    </section>

    <section class="card">
      <h2>🎯 为我推荐</h2>
      <div class="btn-row"><button id="recommend-btn">为我推荐</button><button id="refresh-recommend-btn" class="secondary">换一批</button></div>
      <p class="sub" style="margin-top:8px">仅从当前仓库已有书籍中推荐，不引入外部资源。</p>
    </section>

    <section class="card">
      <h2>🧾 我的偏好说明</h2>
      <div class="sub">
        <p>• 正经向：文学、神话、哲学、精神秩序、宿命感、群像、复杂关系。</p>
        <p>• 快乐狗血向：BL/耽美、古耽、仙侠、权谋、虐恋、破镜重圆、替身、先婚后爱等强拉扯题材。</p>
        <p>• 过滤倾向：尽量避开过度鸡汤、无张力、人物关系单薄内容。</p>
      </div>
    </section>


    <section class="card">
      <h2>📝 我的记录</h2>
      <p id="record-summary" class="sub"></p>
      <div id="record-list"></div>
      <button id="clear-records-btn" class="secondary">清空全部记录</button>
    </section>

    <section id="recommendation-section" class="card">
      <h2>✨ 推荐结果</h2>
      <div class="reco-columns">
        <div>
          <h3>正经阅读</h3>
          <div id="serious-recs"></div>
        </div>
        <div>
          <h3>快乐狗血</h3>
          <div id="fun-recs"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="search.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
    }
  </script>
</body>
</html>
